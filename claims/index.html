<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Who's Answering</title>
<style>
:root{--d:#1f6feb;--h:#ea580c}
html,body{margin:0;height:100%}
body{background:var(--d);color:#fff;font:700 28px/1.2 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;display:flex;align-items:center;justify-content:center;cursor:pointer;user-select:none;transition:background .15s}
body.H{background:var(--h)}
#name{text-align:center}
#st{position:fixed;top:6px;right:8px;font:600 11px/1 sans-serif;opacity:.85}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#ff4d4d;margin-right:4px;vertical-align:middle;border:1px solid #fff}
.dot.on{background:#3ddc84}
</style>
</head>
<body>
<div id="name">Dhruv</div>
<div id="st"></div>
<script>
const ROOM = (location.hash.slice(1) || "calescent-yc-9nov-r7k2m9wq").replace(/[^a-zA-Z0-9_-]/g, "");
const CID = Math.random().toString(36).slice(2, 10);
const KEY = "who";
let cur = {v: "D", ts: 0};
const T = [], status = {};

function render() { document.body.className = cur.v; document.getElementById("name").textContent = cur.v === "H" ? "Hudson" : "Dhruv"; }
function recv(m) { if (m && m.k === KEY && typeof m.ts === "number" && m.ts > cur.ts) { cur = {v: m.v, ts: m.ts}; render(); } }
function setStatus(n, ok) { status[n] = ok; const any = Object.values(status).some(Boolean);
  document.getElementById("st").innerHTML = '<span class="dot' + (any ? " on" : "") + '"></span>' + (any ? "live" : "connecting…"); }
document.body.addEventListener("click", () => {
  const m = {k: KEY, v: cur.v === "H" ? "D" : "H", ts: Date.now() * 1000 + Math.floor(Math.random() * 1000), c: CID};
  recv(m);
  T.forEach(t => { try { t.send(m); } catch (e) {} });
});

// MQTT over WSS (retained)
(function () {
  const s = document.createElement("script");
  s.src = "https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js";
  s.onload = () => {
    const topic = "calescent/who/" + ROOM;
    const cl = mqtt.connect("wss://broker.emqx.io:8084/mqtt", {clientId: "w_" + CID, reconnectPeriod: 2000, connectTimeout: 8000});
    cl.on("connect", () => { setStatus("mqtt", true); cl.subscribe(topic); });
    ["close", "offline", "error"].forEach(e => cl.on(e, () => setStatus("mqtt", false)));
    cl.on("message", (t, p) => { if (p.length) try { recv(JSON.parse(p.toString())); } catch (e) {} });
    T.push({send: m => cl.publish(topic, JSON.stringify(m), {retain: true, qos: 1})});
  };
  document.head.appendChild(s);
  setStatus("mqtt", false);
})();
// ntfy.sh on port 443
(function () {
  const url = "https://ntfy.sh/" + ROOM + "-who";
  const es = new EventSource(url + "/sse?since=all");
  es.onopen = () => setStatus("ntfy", true);
  es.onerror = () => setStatus("ntfy", false);
  es.onmessage = ev => { try { const d = JSON.parse(ev.data); if (d.event === "message") recv(JSON.parse(d.message)); } catch (e) {} };
  T.push({send: m => fetch(url, {method: "POST", body: JSON.stringify(m)}).catch(() => {})});
})();
// same-machine tabs
try { const bc = new BroadcastChannel("who-" + ROOM); bc.onmessage = e => recv(e.data); T.push({send: m => bc.postMessage(m)}); } catch (e) {}
render();
</script>
</body>
</html>
